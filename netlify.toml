# Netlify Configuration for AI DAN SOLUTIONS
[build]
  publish = "."

# Configuración de cabeceras de seguridad y caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache eficiente para assets estáticos
[[headers]]
  for = "/_shared/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
